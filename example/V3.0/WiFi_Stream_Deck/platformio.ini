; CrowPanel 7" ESP32-S3 (ESP32-S3-WROOM-1-N4R8: 4 MB flash + 8 MB OPI PSRAM)
; 800x480 RGB parallel LCD + GT911 capacitive touch
;
; Board variant must stay esp32-s3-devkitc1-n4r8 (vendored in boards/): the stock
; devkitc-1 bootloader never initialises octal PSRAM and the framebuffer alloc
; fails at boot.

[env:crowpanel_7]
platform = espressif32@6.9.0
board = esp32-s3-devkitc1-n4r8
framework = arduino

; huge_app.csv = single ~3 MB app slot, no OTA.
board_build.partitions = huge_app.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 3145728

build_flags =
    ; Serial stays on UART0/CH340; USB-CDC would fight the GT911 over GPIO19/20.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    ; 1 = build the Notes tab, 0 = deck-only (smaller, no diary polling).
    -DENABLE_NOTES_LAYER=1
    ; 1 = always pulse GT911 reset through the PCA9557 (V3.0 touch recovery).
    -DFORCE_TOUCH_RESET=0
    -Iinclude

lib_deps =
    lvgl/lvgl@^8.4.0
    moononournation/GFX Library for Arduino@1.4.7
    bblanchon/ArduinoJson@^7.2.0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800
